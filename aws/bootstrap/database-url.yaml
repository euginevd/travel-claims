# Deploy as stack <ProjectName>-database-url after the secrets unit applies; update it to change the URL.
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Writes the Supabase session pooler URL into the app secret's DATABASE_URL and
  CHECKPOINT_DATABASE_URL, leaving its other keys as they are. Deleting the stack leaves the secret.

Parameters:
  ProjectName:
    Type: String
    Default: travel-claims
    AllowedPattern: '[a-z][a-z0-9-]{1,30}'
    Description: Lowercase kebab-case, as in the bootstrap stack
  Target:
    Type: String
    Default: dev
    Description: The environment whose secret to fill, as in the bootstrap stack
  PoolerUrl:
    Type: String
    NoEcho: true
    AllowedPattern: 'postgres(ql)?://.+'
    ConstraintDescription: The session pooler URL from Supabase, starting postgresql://
    Description: Supabase's session pooler URL (Connect > Session pooler), with the password in it

Resources:
  # The function's only grant: read and write this one secret.
  FillRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Target}-database-url'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Target}/app-*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt FillLogs.Arn
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  FillLogs:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: AWS-managed encryption is enough; the function logs no values
          - id: CKV_AWS_66
            comment: Retention is set; the function logs only success or the error's type
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Target}-database-url'
      RetentionInDays: 7

  FillFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: Only Secrets Manager's public endpoint is reached, so no VPC
          - id: CKV_AWS_116
            comment: CloudFormation calls it synchronously and reports failures itself
          - id: CKV_AWS_115
            comment: Runs once per stack change, so no reserved concurrency
          - id: CKV_AWS_173
            comment: No environment variables
          - id: CKV_AWS_50
            comment: A one-off function, so no tracing
          - id: CKV_AWS_272
            comment: Inline code reviewed in this template, so no code signing
    Properties:
      FunctionName: !Sub '${ProjectName}-${Target}-database-url'
      Description: Writes the database URLs into the app secret
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt FillRole.Arn
      LoggingConfig:
        LogGroup: !Ref FillLogs
      Code:
        ZipFile: |
          import json

          import boto3
          import cfnresponse


          def urls(pooler):
              """Both forms the apps take: psycopg's for the api, plain for the agent's checkpoints."""
              plain = pooler.replace("postgresql+psycopg://", "postgresql://", 1).replace("postgres://", "postgresql://", 1)
              return plain.replace("postgresql://", "postgresql+psycopg://", 1), plain


          def handler(event, context):
              try:
                  if event["RequestType"] in ("Create", "Update"):
                      props = event["ResourceProperties"]
                      client = boto3.client("secretsmanager")
                      try:
                          values = json.loads(client.get_secret_value(SecretId=props["SecretId"])["SecretString"])
                      except client.exceptions.ResourceNotFoundException:
                          values = {}
                      values["DATABASE_URL"], values["CHECKPOINT_DATABASE_URL"] = urls(props["PoolerUrl"])
                      client.put_secret_value(SecretId=props["SecretId"], SecretString=json.dumps(values))
                  print("database URLs written" if event["RequestType"] != "Delete" else "left the secret as it is")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, "database-url")
              except Exception as error:  # report the type only, never a value
                  print(f"failed: {type(error).__name__}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, "database-url", reason=type(error).__name__)
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  # Changing PoolerUrl updates this resource, which writes the new URLs.
  DatabaseUrls:
    Type: Custom::DatabaseUrls
    Properties:
      ServiceToken: !GetAtt FillFunction.Arn
      SecretId: !Sub '${ProjectName}/${Target}/app'
      PoolerUrl: !Ref PoolerUrl
