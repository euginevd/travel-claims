# Deploy once per account as stack <ProjectName>-bootstrap; put its outputs on the aws-<Target>-plan/-apply environments.
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Bootstrap for a project from sdlc-template: everything in the AWS account that Terraform
  needs before it can run. Deployed by hand as stack <ProjectName>-bootstrap; deleting the stack
  removes all of it.

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]{1,30}'
    Description: Lowercase kebab-case; prefixes every resource name
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repo
  GitHubRepo:
    Type: String
    Description: Repository name
  GitHubOwnerId:
    Type: String
    Default: ''
    AllowedPattern: '[0-9]*'
    Description: The owner's numeric ID, for a repo with GitHub's immutable OIDC subject; empty for the name-only subject
  GitHubRepoId:
    Type: String
    Default: ''
    AllowedPattern: '[0-9]*'
    Description: The repo's numeric ID, for a repo with GitHub's immutable OIDC subject; empty for the name-only subject
  Target:
    Type: String
    Default: dev
    Description: Deployment target; the GitHub environments are aws-<target>-plan and aws-<target>-apply
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: An account has one GitHub OIDC provider; set false if another stack already created it

Conditions:
  CreateOidc: !Equals [!Ref CreateOidcProvider, 'true']
  ImmutableSubject: !Not [!Equals [!Ref GitHubRepoId, '']]

Resources:

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - { Key: ManagedBy, Value: CloudFormation }

  # trivy:ignore:AWS-0132 S3-managed encryption is enough for state; the bucket is private and TLS-only
  StateBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Versioning keeps every state change; access logs would need a second bucket. Turn on CloudTrail S3 data events if audits need who made each change
    Properties:
      BucketName: !Sub '${ProjectName}-tfstate-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-state-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: ManagedBy, Value: CloudFormation }

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub '${StateBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Apply role for stage 2 (spec 30-38); everything Terraform creates is named ${ProjectName}-* or ${ProjectName}_*.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-deploy'
      Description: !Sub 'GitHub Actions deploy role for ${GitHubRepo}, aws-${Target}-apply environment'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Waits for the provider when this stack creates it.
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # The immutable subject names the owner and repo by ID too, so a recreated repo of the same name can't assume it.
                token.actions.githubusercontent.com:sub: !If
                  - ImmutableSubject
                  - !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:aws-${Target}-apply'
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepo}:environment:aws-${Target}-apply'
      ManagedPolicyArns:
        - !Ref DeployComputePolicy
        - !Ref DeployAppPolicy
      Policies:
        - PolicyName: terraform-state
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StateBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${ProjectName}/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${StateBucket.Arn}/${ProjectName}/*'
        - PolicyName: project-iam
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Project roles only, and only with the boundary attached.
              - Sid: IamProjectRolesWriteWithBoundary
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref ProjectBoundary
              - Sid: IamProjectRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:Get*
                  - iam:List*
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
              # Function roles to Lambda and the agent's role to AgentCore Runtime; nothing else.
              - Sid: IamPassProjectRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - bedrock-agentcore.amazonaws.com
              # AgentCore creates its service-linked roles on first use; only those, by service name.
              - Sid: IamAgentCoreServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'
                Condition:
                  StringLike:
                    iam:AWSServiceName:
                      - bedrock-agentcore.amazonaws.com
                      - '*.bedrock-agentcore.amazonaws.com'
              # Pipeline roles are off limits.
              - Sid: DenyPipelineRoles
                Effect: Deny
                Action: iam:*
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-github-*'
              - Sid: DenyBoundaryRemoval
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: '*'
              - Effect: Deny
                Action: sts:AssumeRole
                Resource: '*'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: ManagedBy, Value: CloudFormation }

  # Functions, the agent's runtime, images, CDN and logs.
  DeployComputePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-github-deploy-compute'
      Description: !Sub 'Lambda, AgentCore Runtime, ECR, CloudFront and logs for the ${ProjectName} deploy role'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Functions, their URLs and the permissions that let CloudFront call them.
          - Sid: LambdaProjectFunctions
            Effect: Allow
            Action: lambda:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*:*'
          # Runtime and workload identity ARNs use generated IDs, so AgentCore is limited to this region.
          - Sid: AgentCoreRegion
            Effect: Allow
            Action: bedrock-agentcore:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          # App images pushed by the pipeline; Lambda and Runtime pull them.
          - Sid: EcrProjectRepositories
            Effect: Allow
            Action: ecr:*
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}/*'
          - Sid: EcrLogin
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          # CloudFront is global and its IDs are generated, so it's limited to this account.
          - Sid: CloudFrontAccount
            Effect: Allow
            Action: cloudfront:*
            Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:*'
          - Sid: CloudFrontList
            Effect: Allow
            Action:
              - cloudfront:ListCachePolicies
              - cloudfront:ListDistributions
              - cloudfront:ListFunctions
              - cloudfront:ListOriginAccessControls
              - cloudfront:ListResponseHeadersPolicies
            Resource: '*'
          - Sid: LogsProjectGroups
            Effect: Allow
            Action: logs:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*'
          - Sid: LogsRead
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'

  DeployAppPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-github-deploy-app'
      Description: !Sub 'Buckets, secrets, Cognito and Bedrock Guardrails for the ${ProjectName} deploy role'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Receipts and the web apps' buckets.
          - Sid: S3ProjectBuckets
            Effect: Allow
            Action: s3:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*/*'
          # State bucket matches ${ProjectName}-*; only this stack changes it.
          - Sid: DenyStateBucketChanges
            Effect: Deny
            NotAction:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub '${StateBucket.Arn}/*'
          # Terraform creates the secrets empty; their values are set by hand.
          - Sid: SecretsProject
            Effect: Allow
            Action: secretsmanager:*
            Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*'
          - Sid: SecretsRead
            Effect: Allow
            Action:
              - secretsmanager:GetRandomPassword
              - secretsmanager:ListSecrets
            Resource: '*'
          # AWS managed keys only.
          - Sid: KmsRead
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:ListAliases
            Resource: '*'
          # User pools have IDs, not names, so it's limited to this region.
          - Sid: CognitoRegion
            Effect: Allow
            Action: cognito-idp:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: BedrockGuardrails
            Effect: Allow
            Action:
              - bedrock:CreateGuardrail
              - bedrock:CreateGuardrailVersion
              - bedrock:DeleteGuardrail
              - bedrock:GetGuardrail
              - bedrock:ListTagsForResource
              - bedrock:TagResource
              - bedrock:UntagResource
              - bedrock:UpdateGuardrail
            Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*'
          # Guardrails, and the inference profiles the units pick Claude's model IDs from.
          - Sid: BedrockList
            Effect: Allow
            Action:
              - bedrock:GetInferenceProfile
              - bedrock:ListGuardrails
              - bedrock:ListInferenceProfiles
            Resource: '*'

  # Read-only plan role; can't read secrets, so keep secret values out of Terraform state.
  PlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-plan'
      Description: !Sub 'GitHub Actions read-only plan role for ${GitHubRepo}, aws-${Target}-plan environment'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Waits for the provider when this stack creates it.
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # The immutable subject names the owner and repo by ID too, so a recreated repo of the same name can't assume it.
                token.actions.githubusercontent.com:sub: !If
                  - ImmutableSubject
                  - !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:aws-${Target}-plan'
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepo}:environment:aws-${Target}-plan'
      Policies:
        - PolicyName: terraform-plan
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StateBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${ProjectName}/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${StateBucket.Arn}/${ProjectName}/*'
              # Plan takes the state lock.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${StateBucket.Arn}/${ProjectName}/*.tflock'
              - Effect: Allow
                Action:
                  - iam:Get*
                  - iam:List*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/*'
              # Bucket settings only; bucket-level Get* can't read objects.
              - Effect: Allow
                Action:
                  - s3:Get*
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:Get*
                  - bedrock-agentcore:List*
                  - bedrock:GetGuardrail
                  - bedrock:GetInferenceProfile
                  - bedrock:ListGuardrails
                  - bedrock:ListInferenceProfiles
                  - bedrock:ListTagsForResource
                  - cloudfront:DescribeFunction
                  - cloudfront:Get*
                  - cloudfront:List*
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:Describe*
                  - cognito-idp:GetGroup
                  - cognito-idp:GetLogDeliveryConfiguration
                  - cognito-idp:GetUserPoolMfaConfig
                  - cognito-idp:List*
                  - ecr:Describe*
                  - ecr:GetLifecyclePolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:List*
                  - kms:DescribeKey
                  - kms:ListAliases
                  - lambda:Get*
                  - lambda:List*
                  - logs:Describe*
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:ListSecrets
                Resource: '*'
              - Effect: Deny
                Action: sts:AssumeRole
                Resource: '*'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: ManagedBy, Value: CloudFormation }

  # Caps every role Terraform creates (the functions' roles and the agent's runtime role); renaming it fails on the fixed name.
  ProjectBoundary:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: A boundary grants nothing on its own; it caps roles whose own policies are scoped. ECR login and the runtime's metrics have no resource-level scoping
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-boundary'
      Description: !Sub 'Permissions boundary for roles created by ${ProjectName} Terraform'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*'
          # The runtime pulls the agent's image and reports its metrics.
          - Sid: RuntimeImageAndMetrics
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
              - ecr:BatchGetImage
              - ecr:GetAuthorizationToken
              - ecr:GetDownloadUrlForLayer
              - xray:PutTelemetryRecords
              - xray:PutTraceSegments
            Resource: '*'
          # The api starts the agent's work; the agent gets its workload identity.
          - Sid: AgentCore
            Effect: Allow
            Action:
              - bedrock-agentcore:GetWorkloadAccessToken
              - bedrock-agentcore:GetWorkloadAccessTokenForJWT
              - bedrock-agentcore:GetWorkloadAccessTokenForUserId
              - bedrock-agentcore:InvokeAgentRuntime
            Resource: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*'
          # The agent calls the context's IAM-only function URL.
          - Sid: LambdaUrls
            Effect: Allow
            Action:
              - lambda:InvokeFunction
              - lambda:InvokeFunctionUrl
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
          # Agent, copilot and assistants call Claude through a guardrail.
          - Sid: Bedrock
            Effect: Allow
            Action:
              - bedrock:ApplyGuardrail
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*'
              - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*'
              - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*'
          - Sid: Secrets
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*'
          - Sid: Receipts
            Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-receipts-*'
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-receipts-*/*'
          - Sid: KmsThroughServices
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService:
                  - !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                  - !Sub 's3.${AWS::Region}.amazonaws.com'

Outputs:
  BoundaryArn:
    Description: permissions_boundary for roles Terraform creates
    Value: !Ref ProjectBoundary

  StateBucketName:
    Description: GitHub variable TF_STATE_BUCKET on both environments, such as aws-dev-plan and aws-dev-apply
    Value: !Ref StateBucket

  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN on the apply environment, such as aws-dev-apply
    Value: !GetAtt DeployRole.Arn

  PlanRoleArn:
    Description: GitHub variable AWS_PLAN_ROLE_ARN on the plan environment, such as aws-dev-plan
    Value: !GetAtt PlanRole.Arn
