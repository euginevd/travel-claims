# Deploy once per account as stack <ProjectName>-bootstrap; put its outputs on the aws-<Target>-plan/-apply environments.
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Bootstrap for a project from sdlc-template: everything in the AWS account that Terraform
  needs before it can run. Deployed by hand as stack <ProjectName>-bootstrap; deleting the stack
  removes all of it.

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '[a-z][a-z0-9-]{1,30}'
    Description: Lowercase kebab-case; prefixes every resource name
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repo
  GitHubRepo:
    Type: String
    Description: Repository name
  Target:
    Type: String
    Default: dev
    Description: Deployment target; the GitHub environments are aws-<target>-plan and aws-<target>-apply
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: An account has one GitHub OIDC provider; set false if another stack already created it

Conditions:
  CreateOidc: !Equals [!Ref CreateOidcProvider, 'true']

Resources:

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - { Key: ManagedBy, Value: CloudFormation }

  # trivy:ignore:AWS-0132 S3-managed encryption is enough for state; the bucket is private and TLS-only
  StateBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Versioning keeps every state change; access logs would need a second bucket. Turn on CloudTrail S3 data events if audits need who made each change
    Properties:
      BucketName: !Sub '${ProjectName}-tfstate-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-state-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: ManagedBy, Value: CloudFormation }

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub '${StateBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Apply role; everything Terraform creates is named ${ProjectName}-*.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-deploy'
      Description: !Sub 'GitHub Actions deploy role for ${GitHubRepo}, aws-${Target}-apply environment'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Waits for the provider when this stack creates it.
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${GitHubRepo}:environment:aws-${Target}-apply'
      ManagedPolicyArns:
        - !Ref DeployPlatformPolicy
        - !Ref DeployDataPolicy
      Policies:
        - PolicyName: terraform-state
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StateBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${ProjectName}/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${StateBucket.Arn}/${ProjectName}/*'
        - PolicyName: project-iam
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Project roles only, and only with the boundary attached.
              - Sid: IamProjectRolesWriteWithBoundary
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref ProjectBoundary
              - Sid: IamProjectRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:Get*
                  - iam:List*
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
              # Project roles to EKS, EC2 and Pod Identity only.
              - Sid: IamPassProjectRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - eks.amazonaws.com
                      - ec2.amazonaws.com
                      - pods.eks.amazonaws.com
              # Reads the AWS managed EKS policies it attaches.
              - Sid: IamReadAwsManagedPolicies
                Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                Resource: !Sub 'arn:${AWS::Partition}:iam::aws:policy/*'
              # Created once per account on first use.
              - Sid: IamServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - eks.amazonaws.com
                      - eks-nodegroup.amazonaws.com
                      - autoscaling.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - rds.amazonaws.com
              # Pipeline roles are off limits.
              - Sid: DenyPipelineRoles
                Effect: Deny
                Action: iam:*
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-github-*'
              - Sid: DenyBoundaryRemoval
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: '*'
              - Effect: Deny
                Action: sts:AssumeRole
                Resource: '*'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: ManagedBy, Value: CloudFormation }

  # EC2 has no name-based ARNs, so it's limited to this region.
  DeployPlatformPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-github-deploy-platform'
      Description: !Sub 'Network, EKS and ECR for the ${ProjectName} deploy role'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # VPC, subnets, NAT, security groups, launch templates.
          - Sid: Ec2Region
            Effect: Allow
            Action: ec2:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          # Clusters, node groups, add-ons, access entries, pod identity.
          - Sid: EksProjectClusters
            Effect: Allow
            Action: eks:*
            Resource: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:*/${ProjectName}-*'
          - Sid: EksRead
            Effect: Allow
            Action:
              - eks:DescribeAddonConfiguration
              - eks:DescribeAddonVersions
              - eks:ListAccessPolicies
              - eks:ListClusters
            Resource: '*'
          # App images pushed by the pipeline.
          - Sid: EcrProjectRepositories
            Effect: Allow
            Action: ecr:*
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}/*'
          - Sid: EcrLogin
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          # The in-cluster controller creates load balancers.
          - Sid: LoadBalancersRead
            Effect: Allow
            Action: elasticloadbalancing:Describe*
            Resource: '*'
          # EKS AMI and version lookups.
          - Sid: SsmPublicParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/*'

  DeployDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-github-deploy-data'
      Description: !Sub 'Aurora, secrets, receipts, Cognito, Bedrock Guardrails and logs for the ${ProjectName} deploy role'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Clusters, instances, subnet and parameter groups, snapshots.
          - Sid: RdsProjectResources
            Effect: Allow
            Action: rds:*
            Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:*:${ProjectName}-*'
          - Sid: RdsRead
            Effect: Allow
            Action: rds:Describe*
            Resource: '*'
          # Aurora's own master password secret (rds!...).
          - Sid: SecretsProject
            Effect: Allow
            Action: secretsmanager:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!*'
          - Sid: SecretsRead
            Effect: Allow
            Action:
              - secretsmanager:GetRandomPassword
              - secretsmanager:ListSecrets
            Resource: '*'
          # AWS managed keys only.
          - Sid: KmsRead
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:ListAliases
            Resource: '*'
          - Sid: S3ProjectBuckets
            Effect: Allow
            Action: s3:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*/*'
          # State bucket matches ${ProjectName}-*; only this stack changes it.
          - Sid: DenyStateBucketChanges
            Effect: Deny
            NotAction:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub '${StateBucket.Arn}/*'
          # User pools have IDs, not names, so it's limited to this region.
          - Sid: CognitoRegion
            Effect: Allow
            Action: cognito-idp:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: BedrockGuardrails
            Effect: Allow
            Action:
              - bedrock:CreateGuardrail
              - bedrock:CreateGuardrailVersion
              - bedrock:DeleteGuardrail
              - bedrock:GetGuardrail
              - bedrock:ListTagsForResource
              - bedrock:TagResource
              - bedrock:UntagResource
              - bedrock:UpdateGuardrail
            Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*'
          - Sid: BedrockList
            Effect: Allow
            Action: bedrock:ListGuardrails
            Resource: '*'
          # EKS control plane, Aurora and app log groups.
          - Sid: LogsProjectGroups
            Effect: Allow
            Action: logs:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/eks/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/cluster/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/containerinsights/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${ProjectName}/*'
          - Sid: LogsRead
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'

  # Read-only plan role; can't read secrets, so keep secret values out of Terraform state.
  PlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-plan'
      Description: !Sub 'GitHub Actions read-only plan role for ${GitHubRepo}, aws-${Target}-plan environment'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Waits for the provider when this stack creates it.
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${GitHubRepo}:environment:aws-${Target}-plan'
      Policies:
        - PolicyName: terraform-plan
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StateBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${ProjectName}/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${StateBucket.Arn}/${ProjectName}/*'
              # Plan takes the state lock.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${StateBucket.Arn}/${ProjectName}/*.tflock'
              - Effect: Allow
                Action:
                  - iam:Get*
                  - iam:List*
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
              - Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                Resource: !Sub 'arn:${AWS::Partition}:iam::aws:policy/*'
              # Bucket settings only; bucket-level Get* can't read objects.
              - Effect: Allow
                Action:
                  - s3:Get*
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*'
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/*'
              - Effect: Allow
                Action:
                  - bedrock:GetGuardrail
                  - bedrock:ListGuardrails
                  - bedrock:ListTagsForResource
                  - cognito-idp:Describe*
                  - cognito-idp:GetUserPoolMfaConfig
                  - cognito-idp:List*
                  - ec2:Describe*
                  - ecr:Describe*
                  - ecr:GetLifecyclePolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:List*
                  - eks:Describe*
                  - eks:List*
                  - elasticloadbalancing:Describe*
                  - kms:DescribeKey
                  - kms:ListAliases
                  - logs:Describe*
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                  - rds:Describe*
                  - rds:ListTagsForResource
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:ListSecrets
                Resource: '*'
              - Effect: Deny
                Action: sts:AssumeRole
                Resource: '*'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: ManagedBy, Value: CloudFormation }

  # Caps every role Terraform creates; renaming it fails on the fixed name.
  ProjectBoundary:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: A boundary grants nothing on its own; it caps roles whose own policies are scoped. The load balancer controller's WAF actions have no resource-level scoping
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-boundary'
      Description: !Sub 'Permissions boundary for roles created by ${ProjectName} Terraform'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/eks/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/containerinsights/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${ProjectName}/*'
          # Cluster, VPC CNI and load balancer controller manage network and load balancers.
          - Sid: NetworkRegion
            Effect: Allow
            Action:
              - autoscaling:Describe*
              - ec2:*
              - elasticloadbalancing:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: ServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - eks.amazonaws.com
                  - elasticloadbalancing.amazonaws.com
          # Nodes pull from AWS's registries and the project's.
          - Sid: NodesAndPods
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetAuthorizationToken
              - ecr:GetDownloadUrlForLayer
              - eks-auth:AssumeRoleForPodIdentity
              - eks:DescribeCluster
              - kms:DescribeKey
            Resource: '*'
          # Load balancer controller: certificates, Cognito sign-in, WAF.
          - Sid: LoadBalancerController
            Effect: Allow
            Action:
              - acm:DescribeCertificate
              - acm:ListCertificates
              - cognito-idp:DescribeUserPoolClient
              - shield:GetSubscriptionState
              - wafv2:AssociateWebACL
              - wafv2:DisassociateWebACL
              - wafv2:GetWebACL
              - wafv2:GetWebACLForResource
            Resource: '*'
          # Agent, copilot and drafting assistant call Claude through a guardrail.
          - Sid: Bedrock
            Effect: Allow
            Action:
              - bedrock:ApplyGuardrail
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*'
              - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*'
              - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*'
          - Sid: Secrets
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!*'
          - Sid: Receipts
            Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-receipts-*'
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-receipts-*/*'
          - Sid: KmsThroughServices
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService:
                  - !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                  - !Sub 's3.${AWS::Region}.amazonaws.com'

Outputs:
  BoundaryArn:
    Description: permissions_boundary for roles Terraform creates
    Value: !Ref ProjectBoundary

  StateBucketName:
    Description: GitHub variable TF_STATE_BUCKET on both environments, such as aws-dev-plan and aws-dev-apply
    Value: !Ref StateBucket

  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN on the apply environment, such as aws-dev-apply
    Value: !GetAtt DeployRole.Arn

  PlanRoleArn:
    Description: GitHub variable AWS_PLAN_ROLE_ARN on the plan environment, such as aws-dev-plan
    Value: !GetAtt PlanRole.Arn
