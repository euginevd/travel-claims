name: images

# Tier 2 design 10: on merge, builds the four images, scans each and builds its SBOM, pushes them to ECR and the web apps
# to S3, then runs the aws workflow; plain docker.
on:
  push:
    branches: [main]
    paths: [apps/**, data/**, pyproject.toml, uv.lock, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}

jobs:
  build:
    if: vars.PROJECT_NAME != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: api, runner: ubuntu-latest, platform: linux/amd64 }
          - { app: context, runner: ubuntu-latest, platform: linux/amd64 }
          - { app: copilot, runner: ubuntu-latest, platform: linux/amd64 }
          # AgentCore Runtime runs arm64 images.
          - { app: agent, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: aws-dev-apply
    permissions:
      contents: read
      id-token: write
    # Passed to the shell as variables, never pasted into the script.
    env:
      APP: ${{ matrix.app }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build
        id: build
        run: |
          repo="$PROJECT_NAME/$APP"
          if ! aws ecr describe-repositories --repository-names "$repo" > /dev/null 2>&1; then
            echo "::notice::No repository $repo yet: apply the registry unit first."
            exit 0
          fi
          # Tags are immutable, so a rerun for the same commit keeps the image it pushed.
          if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$GITHUB_SHA" > /dev/null 2>&1; then
            echo "::notice::$repo:$GITHUB_SHA is already pushed."
            exit 0
          fi
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          image="$registry/$repo:$GITHUB_SHA"
          # Lambda and Runtime take a plain single-platform image, so no attestation index.
          docker build --platform "$PLATFORM" --provenance=false -f "apps/$APP/Dockerfile" -t "$image" .
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      # Build: scan the built image, OS packages included, before it reaches ECR; a fixable high or critical
      # vulnerability stops the push. The repo scans in the security workflow can't see the image's base layers.
      - name: Trivy, the image
        if: steps.build.outputs.image != ''
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

      # Build: the SBOM of what ships, from the image rather than the lock files, kept 90 days with the run.
      - name: Trivy, SBOM of the image
        if: steps.build.outputs.image != ''
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --format cyclonedx --output "/out/sbom-$APP.cdx.json" "$IMAGE"

      - if: steps.build.outputs.image != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.app }}
          path: sbom-${{ matrix.app }}.cdx.json
          retention-days: 90

      - name: Push
        if: steps.build.outputs.image != ''
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          REGISTRY: ${{ steps.build.outputs.registry }}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker push "$IMAGE"
          echo "Pushed \`$IMAGE\`, scanned, with its SBOM" >> "$GITHUB_STEP_SUMMARY"

  # Each web app (its Cognito client, test buttons on) and the project page, into its bucket.
  web:
    if: vars.PROJECT_NAME != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: portal, audience: customers }
          - { app: dashboard, audience: staff }
          - { app: console, audience: engineering }
          - { app: home, audience: none }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-dev-apply
    permissions:
      contents: read
      id-token: write
    # Passed to the shell as variables, never pasted into the script.
    env:
      APP: ${{ matrix.app }}
      AUDIENCE: ${{ matrix.audience }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build, upload and refresh
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          bucket="$PROJECT_NAME-web-dev-$APP-$account"
          if ! aws s3api head-bucket --bucket "$bucket" > /dev/null 2>&1; then
            echo "::notice::No bucket $bucket yet: apply the web unit first."
            exit 0
          fi
          site() { aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='$PROJECT_NAME-dev-$1'].$2 | [0]" --output text; }
          if [ "$APP" = home ]; then
            # The project page is static files, with the three apps' addresses in links.json.
            mkdir dist && cp -r apps/home/index.html apps/home/styles.css apps/home/app.js apps/home/icon.svg apps/home/fonts apps/home/img apps/home/media dist/
            printf '{"portal":"https://%s/","dashboard":"https://%s/","console":"https://%s/"}\n' "$(site portal DomainName)" "$(site dashboard DomainName)" "$(site console DomainName)" > dist/links.json
          else
            pool="$(aws cognito-idp list-user-pools --max-results 60 --query "UserPools[?Name=='$PROJECT_NAME-dev-$AUDIENCE'].Id | [0]" --output text)"
            client="$(aws cognito-idp list-user-pool-clients --user-pool-id "$pool" --query 'UserPoolClients[0].ClientId' --output text)"
            # The header's back link goes to the project page's own site, not port 5172.
            home="$(site home DomainName)"
            case "$home" in ""|None) echo "::error::No project page site: apply the web unit first."; exit 1 ;; esac
            project="https://$home/"
            docker build --target build --build-arg VITE_COGNITO_CLIENT_ID="$client" --build-arg VITE_COGNITO_REGION="$AWS_REGION" --build-arg VITE_TEST_SIGN_IN=true --build-arg VITE_PROJECT_URL="$project" -f "apps/$APP/Dockerfile" -t "web-$APP" .
            id="$(docker create "web-$APP")"
            docker cp "$id:/web/dist" ./dist
          fi
          aws s3 sync ./dist "s3://$bucket" --delete
          distribution="$(site "$APP" Id)"
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' > /dev/null
          echo "Deployed $APP to \`$bucket\`" >> "$GITHUB_STEP_SUMMARY"

  # The units pick up the newest image, so a deploy is an aws workflow run.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Ask the aws workflow to deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run aws.yml -R "$GITHUB_REPOSITORY" -f target=dev -f unit=all -f action=apply
