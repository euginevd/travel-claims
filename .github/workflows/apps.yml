name: apps

# Each app's checks on every PR. Tools run in pinned container images,
# so no third-party action code runs in the pipeline.
# A PR runs only the jobs its changed files need: a docs-only PR skips them all, and a skipped
# required check counts as passed. Not rerun on main: the ruleset makes each PR test against the
# latest main before it merges, so the merged code is what was tested.
on:
  pull_request:

permissions:
  contents: read

jobs:
  # Which apps the PR touches. A file outside the known paths runs every job, and so does a
  # failure here: the jobs below run unless this job says "false".
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.diff.outputs.python }}
      dashboard: ${{ steps.diff.outputs.dashboard }}
      console: ${{ steps.diff.outputs.console }}
      portal: ${{ steps.diff.outputs.portal }}
      workflows: ${{ steps.diff.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        name: Apps changed by this PR
        run: |
          # HEAD is the PR merged into main; its first parent is main.
          files=$(git diff --name-only HEAD^1 HEAD) || { { echo "python=true"; echo "dashboard=true"; echo "console=true"; echo "portal=true"; echo "workflows=true"; } >> "$GITHUB_OUTPUT"; exit 0; }
          python=false; dashboard=false; console=false; portal=false; workflows=false
          while IFS= read -r f; do
            case "$f" in .github/workflows/* | *.sh) workflows=true ;; esac
            case "$f" in
              "") ;;
              apps/dashboard/*) dashboard=true ;;
              apps/console/*) console=true ;;
              apps/portal/*) portal=true ;;
              packages/web-core/*) dashboard=true; console=true; portal=true ;;
              apps/* | data/* | *.py | pyproject.toml | uv.lock | .python-version) python=true ;;
              *.md | docs/* | guides/* | LICENSE | infra/* | .vscode/*) ;;
              *) python=true; dashboard=true; console=true; portal=true ;;
            esac
          done <<< "$files"
          echo "$files"
          echo "python=$python dashboard=$dashboard console=$console portal=$portal workflows=$workflows"
          { echo "python=$python"; echo "dashboard=$dashboard"; echo "console=$console"; echo "portal=$portal"; echo "workflows=$workflows"; } >> "$GITHUB_OUTPUT"

  # From sdlc-template: agents edit the workflows and scripts, so each change is linted. actionlint
  # for syntax, expressions and the shell in run steps, zizmor for injection, credentials and
  # permissions, shellcheck for the repo's scripts at warning level. All from pinned images, offline.
  workflows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.workflows != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint, zizmor and shellcheck
        run: |
          code=0
          mapfile -t scripts < <(git ls-files '*.sh')
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color || code=1
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d --offline .github/workflows || code=1
          docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d -S warning "${scripts[@]}" || code=1
          exit $code

  # From sdlc-template: once a profile is set, no *(to fill in)* line is left in docs/ (AGENTS.md rule 13).
  kickoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No to-fill-in lines once a profile is set
        run: |
          grep -qE '^Profile: .(prototype|production).' docs/spec.md || { echo "No profile yet: kickoff isn't finished, nothing to check."; exit 0; }
          if grep -rnF --include='*.md' '*(to fill in)*' docs/; then
            echo "::error::Kickoff left the lines above unfilled (AGENTS.md rule 13): write each one, or delete it."
            exit 1
          fi
          echo "Every to-fill-in line in docs/ is written."

  python:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ghcr.io/astral-sh/uv:0.13.8-python3.14-trixie@sha256:b60feb07c9c2a9b41d8a6dd97fa76ecf2107ee31be002cc76c8a1814d0dba3dc
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright
      - run: uv run pytest -q

  api-on-postgres:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ghcr.io/astral-sh/uv:0.13.8-python3.14-trixie@sha256:b60feb07c9c2a9b41d8a6dd97fa76ecf2107ee31be002cc76c8a1814d0dba3dc
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-retries 10
    env:
      UV_PYTHON_DOWNLOADS: never
      # The tests own this throwaway database and empty it before each one.
      TEST_DATABASE_URL: postgresql+psycopg://test:test@postgres:5432/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: uv sync --locked
      - run: uv run pytest -q --no-cov apps/api/tests

  dashboard:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.dashboard != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24.22.1-bookworm-slim@sha256:be8204d4bd327363357f532187b752ff62759c31bedf98e9e18fc08c9cbd605c
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  console:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.console != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24.22.1-bookworm-slim@sha256:be8204d4bd327363357f532187b752ff62759c31bedf98e9e18fc08c9cbd605c
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  portal:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.portal != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24.22.1-bookworm-slim@sha256:be8204d4bd327363357f532187b752ff62759c31bedf98e9e18fc08c9cbd605c
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The browser tests against the whole Docker Compose stack, as on a laptop: each app signs in,
  # each audience's token is refused on the others' routes, and axe finds nothing serious. The
  # Claude key is a dummy, so tests that call a model (tagged @model) run only on a laptop.
  e2e:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.python != 'false' || needs.changes.outputs.dashboard != 'false' || needs.changes.outputs.console != 'false' || needs.changes.outputs.portal != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway values for a stack that lives only in this job.
      POSTGRES_USER: undercover
      POSTGRES_PASSWORD: e2e-only
      POSTGRES_DB: undercover
      ENVIRONMENT: local
      LOCAL_SIGN_IN: "true"
      HANDLER_PASSWORD: e2e-only
      UNDERCOVER_API_KEY: e2e-only-key-for-a-throwaway-stack-000
      ANTHROPIC_API_KEY: sk-ant-not-a-real-key
      ANTHROPIC_WORKSPACE_ID: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack
        working-directory: e2e
        run: docker compose -p undercover-e2e -f ../docker-compose.yml -f compose.ports.yml up --build -d --wait
      - name: Browser tests, without model calls
        run: >-
          docker run --rm --network host --ipc host -v "$PWD/e2e:/e2e" -w /e2e
          mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
          sh -c "npm ci --ignore-scripts && npx playwright test --grep-invert @model"
      - name: Stack logs on failure
        if: failure()
        working-directory: e2e
        run: docker compose -p undercover-e2e -f ../docker-compose.yml -f compose.ports.yml logs --no-color --tail 200
