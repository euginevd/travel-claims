name: aws

# One Terraform root per deployable unit in aws/<unit>/. Plans each changed unit with a read-only
# role; applies after approval in the apply environment.
# dev: planned on every PR, applied on merge to main. prod: a manual run with target prod promotes main.
# Repository variables: PROJECT_NAME, and optionally AWS_REGION (default ap-southeast-2).
# Environment variables, set on each aws-<target>-plan and aws-<target>-apply environment from that
# account's bootstrap stack: AWS_PLAN_ROLE_ARN (plan), AWS_DEPLOY_ROLE_ARN (apply), TF_STATE_BUCKET (both).
# Cost comment: secret INFRACOST_API_KEY; optional variables MONTHLY_COST_LIMIT (warns above it) and COST_CURRENCY (default USD).
on:
  pull_request:
    paths: [aws/**, '!aws/bootstrap/**', .github/workflows/aws.yml]
  push:
    branches: [main]
    paths: [aws/**, '!aws/bootstrap/**', .github/workflows/aws.yml]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy to
        type: choice
        options: [dev, prod]
        default: dev
      unit:
        description: Unit folder under aws/, or all
        type: string
        default: all
      action:
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: read

concurrency:
  group: aws-${{ inputs.target || 'dev' }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.17.1
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  TARGET: ${{ inputs.target || 'dev' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_VAR_project: ${{ vars.PROJECT_NAME }}
  TF_VAR_environment: ${{ inputs.target || 'dev' }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Manual run: the chosen unit, or every unit for all. Workflow change: every unit. Otherwise: units with changed files.
      - id: units
        env:
          EVENT: ${{ github.event_name }}
          INPUT_UNIT: ${{ inputs.unit }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=$(find aws -mindepth 1 -maxdepth 1 -type d ! -name bootstrap ! -name '_*' -printf '%f\n')
          if [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_UNIT" = all ]; then
            units="$all"
          elif [ "$EVENT" = workflow_dispatch ]; then
            units=$(echo "$INPUT_UNIT" | grep -Fx "$all" || { echo "No unit aws/$INPUT_UNIT"; exit 1; })
          else
            changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            if echo "$changed" | grep -qx .github/workflows/aws.yml; then
              units="$all"
            else
              units=$(echo "$changed" | sed -n 's|^aws/\([^/]*\)/.*|\1|p' | sort -u | grep -Fx "$all" || true)
            fi
          fi
          echo "units=$(echo "$units" | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  # Skipped until the project is bootstrapped and PROJECT_NAME is set.
  plan:
    needs: detect
    if: needs.detect.outputs.units != '[]' && vars.PROJECT_NAME != ''
    runs-on: ubuntu-latest
    environment: aws-${{ inputs.target || 'dev' }}-plan
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJson(needs.detect.outputs.units) }}
    defaults:
      run:
        working-directory: aws/${{ matrix.unit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION" -backend-config="key=$PROJECT_NAME/${{ matrix.unit }}.tfstate"
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      - run: terraform validate

      # -detailed-exitcode: 0 no changes, 2 changes, 1 error.
      - name: Plan
        env:
          DESTROY: ${{ inputs.action == 'destroy' && '-destroy' || '' }}
        run: |
          ec=0
          terraform plan -input=false $DESTROY -out=tfplan -detailed-exitcode || ec=$?
          [ "$ec" -eq 1 ] && exit 1
          terraform show -json tfplan > plan.json
          [ "$ec" -eq 2 ] || rm tfplan
          {
            echo "## Terraform plan: ${{ matrix.unit }} in $TARGET ${DESTROY}"
            if [ -f tfplan ]; then
              terraform show -no-color tfplan | grep -E '^Plan:' || true
              echo
              echo '<details><summary>Full plan</summary>'
              echo
              echo '```'
              terraform show -no-color tfplan
              echo '```'
              echo '</details>'
            else
              echo 'No changes.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Prices the plan from a pinned image; only price lookups leave the runner, and plan.json is deleted after.
      - name: Cost
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          INFRACOST_CURRENCY: ${{ vars.COST_CURRENCY || 'USD' }}
          UNIT: ${{ matrix.unit }}
        run: |
          trap 'rm -f plan.json infracost.json' EXIT
          [ -n "$INFRACOST_API_KEY" ] || { echo "No INFRACOST_API_KEY secret, so no cost estimate."; exit 0; }
          docker run --rm -e INFRACOST_API_KEY -e INFRACOST_CURRENCY -e INFRACOST_SKIP_UPDATE_CHECK=true -v "$PWD:/unit" --entrypoint infracost infracost/infracost:0.10.47@sha256:76ad6948e83bffb4b6127c9cae13faea068981bcb2b081526920d9bb88a399e1 diff --path /unit/plan.json --format json --out-file /unit/infracost.json || true
          python3 ../../scripts/cost-report.py parse "$UNIT" infracost.json plan.json "cost-$UNIT.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cost-${{ matrix.unit }}
          path: aws/${{ matrix.unit }}/cost-${{ matrix.unit }}.json
          if-no-files-found: ignore
          retention-days: 1

      # Only units with changes upload a plan; apply skips the rest. Zips built at plan time go with it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ matrix.unit }}
          path: |
            aws/${{ matrix.unit }}/tfplan
            aws/${{ matrix.unit }}/*.zip
          if-no-files-found: ignore
          retention-days: 1

  # One cost comment per PR, updated on each push; no AWS role.
  cost-report:
    needs: plan
    if: always() && github.event_name == 'pull_request' && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: cost-*
          path: cost
          merge-multiple: true
      - name: Post the estimate on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          LIMIT: ${{ vars.MONTHLY_COST_LIMIT }}
        run: |
          python3 scripts/cost-report.py comment cost "$SHA" "$LIMIT" > comment.md
          [ -s comment.md ] || { echo "No cost estimates to post."; exit 0; }
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- cost-report -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

  apply:
    needs: [detect, plan]
    # Runs even when some plans failed: a unit without a saved plan skips, so ready units still apply.
    if: always() && !cancelled() && needs.detect.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && vars.PROJECT_NAME != ''
    runs-on: ubuntu-latest
    environment: aws-${{ inputs.target || 'dev' }}-apply
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJson(needs.detect.outputs.units) }}
    defaults:
      run:
        working-directory: aws/${{ matrix.unit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: tfplan-${{ matrix.unit }}
          path: aws/${{ matrix.unit }}

      - id: has_plan
        run: echo "found=$([ -f tfplan ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.has_plan.outputs.found == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.has_plan.outputs.found == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - if: steps.has_plan.outputs.found == 'true'
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION" -backend-config="key=$PROJECT_NAME/${{ matrix.unit }}.tfstate"
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

      # Applies the reviewed plan exactly; fails if state changed since.
      - if: steps.has_plan.outputs.found == 'true'
        run: terraform apply -input=false tfplan
