# Weekly update PRs for pinned versions, one per ecosystem; a release must be 7 days old (AGENTS.md rule 18).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directories: ["/apps/portal", "/apps/dashboard", "/apps/console"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { web: { patterns: ["*"] } }
    # Majors wait for the lint plugins to support them (jsx-a11y on ESLint 10, typescript-eslint on
    # TypeScript 7); upgrade those by hand. Minor and patch updates still come through.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories: ["/apps/*"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { images: { patterns: ["*"] } }
    # The runtime image must match the build stage's Python (decision 9); a minor bump breaks the venv.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # A major PostgreSQL upgrade needs a dump and restore of the data volume; do it deliberately.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directories: ["/aws/*"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { terraform: { patterns: ["*"] } }
