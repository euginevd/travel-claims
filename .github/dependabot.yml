# Weekly update PRs for pinned versions, one per ecosystem; a release must be 7 days old (AGENTS.md rule 18).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directories: ["/apps/portal", "/apps/dashboard"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { web: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: ["/apps/*"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { images: { patterns: ["*"] } }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: terraform
    directories: ["/aws/*"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { terraform: { patterns: ["*"] } }
