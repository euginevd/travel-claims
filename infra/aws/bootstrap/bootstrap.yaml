# Deploy once per account as stack <ProjectName>-bootstrap; copy its outputs to the aws-dev-plan/-apply environments.
# Costs about $0 a month: IAM is free, and the state bucket holds a few small files; it runs nothing itself.
AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC, Terraform state, plan and deploy roles, and a role boundary; deployed once.

Parameters:
  ProjectName:
    Type: String
    Default: travel-claims
    AllowedPattern: '[a-z][a-z0-9-]{1,30}'
    Description: Lowercase kebab-case; prefixes every resource name
  GitHubRepo:
    Type: String
    Default: euginevd/travel-claims
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
    Description: owner/repo; public, so a default is safe (change it for another project)
  GitHubIds:
    Type: String
    Default: 55682357/1449903483
    AllowedPattern: '([0-9]+/[0-9]+)?'
    Description: ownerId/repoId for GitHub's immutable OIDC subject (public, from GitHub's API); empty for the name-only subject
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: One GitHub OIDC provider per account; false if another stack made it

Conditions:
  CreateOidc: !Equals [!Ref CreateOidcProvider, 'true']
  ImmutableSubject: !Not [!Equals [!Ref GitHubIds, '']]

Resources:

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - { Key: ManagedBy, Value: CloudFormation }

  # trivy:ignore:AWS-0132 S3-managed encryption is enough for state; the bucket is private and TLS-only
  StateBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Versioning keeps every state change; access logs would need a second bucket
    Properties:
      BucketName: !Sub '${ProjectName}-tfstate-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-state-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: ManagedBy, Value: CloudFormation }

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub '${StateBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Apply role; everything Terraform makes is named ${ProjectName}-* or ${ProjectName}_*.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-deploy'
      Description: !Sub 'GitHub Actions deploy role for ${GitHubRepo}, aws-dev-apply environment'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # The immutable subject also names the owner and repo by ID, so a recreated repo can't assume it.
                token.actions.githubusercontent.com:sub: !If
                  - ImmutableSubject
                  - !Sub
                    - 'repo:${Owner}@${OwnerId}/${Repo}@${RepoId}:environment:aws-dev-apply'
                    - Owner: !Select [0, !Split ['/', !Ref GitHubRepo]]
                      Repo: !Select [1, !Split ['/', !Ref GitHubRepo]]
                      OwnerId: !Select [0, !Split ['/', !Ref GitHubIds]]
                      RepoId: !Select [1, !Split ['/', !Ref GitHubIds]]
                  - !Sub 'repo:${GitHubRepo}:environment:aws-dev-apply'
      ManagedPolicyArns:
        - !Ref DeployComputePolicy
        - !Ref DeployDataPolicy
        - !Ref DeployOpsPolicy
        - !Ref DeployAiPolicy
        - !Ref DeployNetworkPolicy
      Policies:
        - PolicyName: terraform-state
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StateBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${ProjectName}/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${StateBucket.Arn}/${ProjectName}/*'
        - PolicyName: project-iam
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Project roles only, and only with the boundary attached.
              - Sid: IamProjectRolesWriteWithBoundary
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref ProjectBoundary
              - Sid: IamProjectRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:Get*
                  - iam:List*
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
              - Sid: IamPassProjectRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - bedrock-agentcore.amazonaws.com
                      - bedrock.amazonaws.com
                      - cloudtrail.amazonaws.com
                      - states.amazonaws.com
                      - scheduler.amazonaws.com
                      - events.amazonaws.com
                      - apigateway.amazonaws.com
                      - cognito-identity.amazonaws.com
                      - comprehend.amazonaws.com
                      - kendra.amazonaws.com
                      - textract.amazonaws.com
                      - transcribe.amazonaws.com
              # Services that make their own service-linked role on first use; only these.
              - Sid: IamServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'
                Condition:
                  StringLike:
                    iam:AWSServiceName:
                      - bedrock-agentcore.amazonaws.com
                      - '*.bedrock-agentcore.amazonaws.com'
                      - dsql.amazonaws.com
                      - access-analyzer.amazonaws.com
                      - guardduty.amazonaws.com
                      - malware-protection.guardduty.amazonaws.com
                      - securityhub.amazonaws.com
                      - config.amazonaws.com
                      - wafv2.amazonaws.com
                      - delivery.logs.amazonaws.com
                      - observability.aoss.amazonaws.com
                      - ops.apigateway.amazonaws.com
              - Sid: DenyPipelineRoles
                Effect: Deny
                Action: iam:*
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-github-*'
              - Sid: DenyBoundaryRemoval
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: '*'
              - Effect: Deny
                Action: sts:AssumeRole
                Resource: '*'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: ManagedBy, Value: CloudFormation }

  # Functions, the agent's runtime, images, CDN and its pricing plan, and logs.
  DeployComputePolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: Pricing plans and log deliveries have no resource ARN before they exist; paid plans are denied
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-github-deploy-compute'
      Description: !Sub 'Lambda, AgentCore, ECR, CloudFront and logs for the ${ProjectName} deploy role'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaProject
            Effect: Allow
            Action: lambda:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:layer:${ProjectName}-*'
          # AgentCore ARNs use generated IDs, so it's limited to this region.
          - Sid: AgentCoreRegion
            Effect: Allow
            Action: bedrock-agentcore:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: EcrProject
            Effect: Allow
            Action: ecr:*
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}/*'
          - Sid: EcrLogin
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          # CloudFront is global and its IDs are generated, so it's limited to this account.
          - Sid: CloudFrontAccount
            Effect: Allow
            Action: cloudfront:*
            Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:*'
          - Sid: CloudFrontList
            Effect: Allow
            Action:
              - cloudfront:List*
              - cloudfront:Describe*
            Resource: '*'
          # The free flat-rate plan (CloudFront, WAF, DDoS); only a person can approve a paid one.
          - Sid: PricingPlans
            Effect: Allow
            Action: pricingplanmanager:*
            Resource: '*'
          - Sid: DenyPaidPlans
            Effect: Deny
            Action: pricingplanmanager:ApprovePaidSubscription
            Resource: '*'
          # The web ACL for CloudFront lives in us-east-1; regional ones in this region.
          - Sid: WafProject
            Effect: Allow
            Action: wafv2:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/*'
              - !Sub 'arn:${AWS::Partition}:wafv2:${AWS::Region}:${AWS::AccountId}:regional/*'
          - Sid: WafList
            Effect: Allow
            Action:
              - wafv2:CheckCapacity
              - wafv2:Describe*
              - wafv2:List*
            Resource: '*'
          - Sid: LogsProject
            Effect: Allow
            Action: logs:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*'
              - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/vendedlogs/*'
              - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/cloudtrail/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:aws-waf-logs-${ProjectName}-*'
          # Log delivery for WAF and AgentCore observability.
          - Sid: LogsDelivery
            Effect: Allow
            Action:
              - logs:*Deliver*
              - logs:*ResourcePolic*
              - logs:Describe*
              - logs:ListTagsForResource
              - logs:TagResource
              - logs:UntagResource
            Resource: '*'

  # Buckets, the database, parameters and secrets, keys and sign-in.
  DeployDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-github-deploy-data'
      Description: !Sub 'S3, DSQL, DynamoDB, SSM, secrets, KMS and Cognito for the ${ProjectName} deploy role'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3Project
            Effect: Allow
            Action: s3:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*/*'
          # The state bucket matches ${ProjectName}-*; only this stack changes it.
          - Sid: DenyStateBucketChanges
            Effect: Deny
            NotAction:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub '${StateBucket.Arn}/*'
          # Cluster ARNs use generated IDs, so DSQL is limited to this region.
          - Sid: DsqlRegion
            Effect: Allow
            Action: dsql:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: DynamoDbProject
            Effect: Allow
            Action: dynamodb:*
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-*'
          - Sid: DynamoDbList
            Effect: Allow
            Action:
              - dynamodb:Describe*
              - dynamodb:List*
            Resource: '*'
          - Sid: SsmProject
            Effect: Allow
            Action: ssm:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*'
              # What the platform team publishes for the workload (decision 41): IDs, not secrets.
              - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/platform/*'
          # The project's secrets, and AgentCore Identity's for its credential providers.
          - Sid: SecretsProject
            Effect: Allow
            Action: secretsmanager:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore*'
          - Sid: ParametersAndSecretsList
            Effect: Allow
            Action:
              - secretsmanager:GetRandomPassword
              - secretsmanager:ListSecrets
              - ssm:DescribeParameters
            Resource: '*'
          # Customer-managed keys, if ever turned on (decisions): only keys tagged with the project.
          - Sid: KmsCreateTagged
            Effect: Allow
            Action:
              - kms:CreateKey
              - kms:TagResource
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestTag/Project: !Ref ProjectName
          - Sid: KmsProjectKeys
            Effect: Allow
            Action: kms:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:ResourceTag/Project: !Ref ProjectName
          - Sid: KmsProjectAliases
            Effect: Allow
            Action: kms:*Alias
            Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/${ProjectName}-*'
          - Sid: KmsList
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:ListAliases
              - kms:ListKeys
            Resource: '*'
          # User pools have IDs, not names, so Cognito is limited to this region.
          - Sid: CognitoRegion
            Effect: Allow
            Action: cognito-idp:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region

  # Alarms, alerts, budgets and the audit and threat services, free or paid (decisions).
  DeployOpsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-github-deploy-ops'
      Description: !Sub 'CloudWatch, SNS, EventBridge, Budgets and the security services for the ${ProjectName} deploy role'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Alarms in this region and in us-east-1, where CloudFront's and the bill's metrics are.
          - Sid: CloudWatchProject
            Effect: Allow
            Action: cloudwatch:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:alarm:${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/${ProjectName}-*'
          - Sid: CloudWatchRead
            Effect: Allow
            Action:
              - cloudwatch:Describe*
              - cloudwatch:Get*
              - cloudwatch:List*
            Resource: '*'
          - Sid: SnsProject
            Effect: Allow
            Action: sns:*
            Resource: !Sub 'arn:${AWS::Partition}:sns:*:${AWS::AccountId}:${ProjectName}-*'
          - Sid: EventsProject
            Effect: Allow
            Action: events:*
            Resource: !Sub 'arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/${ProjectName}-*'
          - Sid: BudgetsProject
            Effect: Allow
            Action: budgets:*
            Resource: !Sub 'arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/${ProjectName}-*'
          - Sid: CloudTrailProject
            Effect: Allow
            Action: cloudtrail:*
            Resource: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-*'
          - Sid: OpsList
            Effect: Allow
            Action:
              - budgets:Describe*
              - budgets:View*
              - cloudtrail:Describe*
              - cloudtrail:List*
              - cloudtrail:LookupEvents
              - events:Describe*
              - events:List*
              - sns:List*
            Resource: '*'
          # Account-wide services with generated IDs, so they're limited to this region.
          - Sid: SecurityServicesRegion
            Effect: Allow
            Action:
              - access-analyzer:*
              - config:*
              - guardduty:*
              - securityhub:*
              - xray:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region

  # All of Bedrock and AgentCore, AWS's AI services and the pieces agent workflows are built from.
  DeployAiPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-github-deploy-ai'
      Description: !Sub 'Bedrock, AI services and workflow services for the ${ProjectName} deploy role'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Guardrails, knowledge bases, evaluations, prompts, flows, agents, batch and custom models; IDs are generated.
          - Sid: AiRegion
            Effect: Allow
            Action:
              - aoss:*
              - bedrock:*
              - comprehend:*
              - kendra:*
              - polly:*
              - rekognition:*
              - textract:*
              - transcribe:*
              - translate:*
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          # Monthly commitments are for a person to buy, never the pipeline.
          - Sid: DenyCommitments
            Effect: Deny
            Action:
              - aws-marketplace:Subscribe
              - bedrock:CreateProvisionedModelThroughput
              - bedrock:UpdateProvisionedModelThroughput
            Resource: '*'
          - Sid: S3VectorsProject
            Effect: Allow
            Action: s3vectors:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ProjectName}-*/index/*'
          # Queues, state machines and schedules for agent workflows, by name.
          - Sid: WorkflowProject
            Effect: Allow
            Action:
              - scheduler:*
              - sqs:*
              - states:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:*:${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/*/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${ProjectName}-*'
          # API Gateway and identity pools have generated IDs, so they're limited to this region.
          - Sid: ApisRegion
            Effect: Allow
            Action:
              - apigateway:*
              - cognito-identity:*
              - scheduler:List*
              - sqs:ListQueues
              - states:List*
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region

  # Read-only plan role; can't read secrets, parameters' values, objects or items.
  # The workload's side of the platform's network (decisions 36 and 41): its security groups and DSQL's
  # endpoint in the platform's VPC, in this region only. The VPC itself is the platform team's.
  DeployNetworkPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: Security groups and endpoints have generated IDs, so they're limited to this region and these actions
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-github-deploy-network'
      Description: !Sub 'Security groups and VPC endpoints for the ${ProjectName} deploy role'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: NetworkRegion
            Effect: Allow
            Action:
              - ec2:Describe*
              - ec2:*SecurityGroup
              - ec2:*SecurityGroupIngress
              - ec2:*SecurityGroupEgress
              - ec2:*VpcEndpoint
              - ec2:*VpcEndpoints
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:DeleteNetworkInterface
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region

  PlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-plan'
      Description: !Sub 'GitHub Actions read-only plan role for ${GitHubRepo}, aws-dev-plan environment'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # The immutable subject also names the owner and repo by ID, so a recreated repo can't assume it.
                token.actions.githubusercontent.com:sub: !If
                  - ImmutableSubject
                  - !Sub
                    - 'repo:${Owner}@${OwnerId}/${Repo}@${RepoId}:environment:aws-dev-plan'
                    - Owner: !Select [0, !Split ['/', !Ref GitHubRepo]]
                      Repo: !Select [1, !Split ['/', !Ref GitHubRepo]]
                      OwnerId: !Select [0, !Split ['/', !Ref GitHubIds]]
                      RepoId: !Select [1, !Split ['/', !Ref GitHubIds]]
                  - !Sub 'repo:${GitHubRepo}:environment:aws-dev-plan'
      Policies:
        - PolicyName: terraform-plan
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StateBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${ProjectName}/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${StateBucket.Arn}/${ProjectName}/*'
              # Plan takes the state lock.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${StateBucket.Arn}/${ProjectName}/*.tflock'
              - Effect: Allow
                Action:
                  - iam:Get*
                  - iam:List*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/*'
              # Bucket settings only; bucket-level Get* can't read objects.
              - Effect: Allow
                Action:
                  - s3:Get*
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-*'
              # Except the knowledge bucket's, which hold only the public policy wording.
              - Effect: Allow
                Action: s3:GetObject*
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-knowledge-*/*'
              # And the IDs the platform publishes for the workload network (decision 36).
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/platform/*'
              - Effect: Allow
                Action:
                  - s3vectors:Get*
                  - s3vectors:List*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ProjectName}-*'
                  - !Sub 'arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ProjectName}-*/index/*'
              # Settings only: no GetSecretValue, GetParameter, GetItem or kms:Decrypt.
              - Effect: Allow
                Action:
                  - access-analyzer:Get*
                  - aoss:BatchGet*
                  - aoss:Get*
                  - aoss:List*
                  - apigateway:GET
                  - access-analyzer:List*
                  - bedrock-agentcore:Get*
                  - bedrock-agentcore:List*
                  - bedrock:Get*
                  - bedrock:List*
                  - budgets:Describe*
                  - budgets:ListTagsForResource
                  - budgets:View*
                  - cloudfront:Describe*
                  - cloudfront:Get*
                  - cloudfront:List*
                  - cloudtrail:Describe*
                  - cloudtrail:Get*
                  - cloudtrail:List*
                  - cloudwatch:Describe*
                  - cloudwatch:Get*
                  - cloudwatch:List*
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:Describe*
                  - cognito-idp:GetGroup
                  - cognito-idp:GetLogDeliveryConfiguration
                  - cognito-idp:GetUserPoolMfaConfig
                  - cognito-idp:List*
                  - cognito-identity:Describe*
                  - cognito-identity:GetIdentityPoolRoles
                  - cognito-identity:List*
                  - comprehend:Describe*
                  - comprehend:List*
                  - config:Describe*
                  - config:List*
                  - dsql:Get*
                  - dsql:List*
                  - dynamodb:Describe*
                  - dynamodb:List*
                  - ec2:Describe*
                  - ecr:Describe*
                  - ecr:GetLifecyclePolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:List*
                  - kendra:Describe*
                  - kendra:List*
                  - events:Describe*
                  - events:List*
                  - guardduty:Describe*
                  - guardduty:Get*
                  - guardduty:List*
                  - kms:Describe*
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                  - kms:List*
                  - lambda:Get*
                  - lambda:List*
                  - logs:Describe*
                  - logs:Get*Deliver*
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                  - polly:GetLexicon
                  - polly:List*
                  - pricingplanmanager:Get*
                  - pricingplanmanager:List*
                  - rekognition:Describe*
                  - rekognition:List*
                  - scheduler:Get*
                  - scheduler:List*
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:ListSecrets
                  - securityhub:Describe*
                  - securityhub:Get*
                  - securityhub:List*
                  - sns:Get*
                  - sns:List*
                  - sqs:GetQueueAttributes
                  - sqs:ListQueue*
                  - ssm:DescribeParameters
                  - ssm:ListTagsForResource
                  - states:DescribeStateMachine*
                  - states:List*
                  - textract:GetAdapter*
                  - textract:List*
                  - transcribe:Describe*
                  - transcribe:Get*Vocabulary*
                  - transcribe:List*
                  - translate:GetTerminology
                  - translate:List*
                  - wafv2:Describe*
                  - wafv2:Get*
                  - wafv2:List*
                  - xray:Get*
                  - xray:List*
                Resource: '*'
              - Effect: Deny
                Action: sts:AssumeRole
                Resource: '*'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: ManagedBy, Value: CloudFormation }

  # Caps every role Terraform makes; renaming it fails on the fixed name.
  ProjectBoundary:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: A boundary grants nothing on its own; it caps roles whose own policies are scoped
          - id: CKV_AWS_109
            comment: A boundary grants nothing on its own; wide for AI features while building, narrowed by the permissions audit (TODO)
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-boundary'
      Description: !Sub 'Permissions boundary for roles made by ${ProjectName} Terraform'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/cloudtrail/${ProjectName}-*'
          # The runtime pulls the agent's image and reports metrics and traces.
          - Sid: ImageMetricsTraces
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
              - ecr:BatchGetImage
              - ecr:GetAuthorizationToken
              - ecr:GetDownloadUrlForLayer
              - xray:PutTelemetryRecords
              - xray:PutTraceSegments
            Resource: '*'
          # Online evaluations read the agent's spans and runtime logs (decision 38).
          - Sid: EvaluationReads
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:FilterLogEvents
              - logs:GetLogEvents
              - logs:GetQueryResults
              - logs:StartQuery
              - logs:StopQuery
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          # Lambda's network interfaces in the platform's private subnets (decision 36); no resource ARN.
          - Sid: LambdaNetwork
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'
          # Every AgentCore feature: Runtime, Gateway, Memory, Identity, Code Interpreter and Browser.
          - Sid: AgentCore
            Effect: Allow
            Action: bedrock-agentcore:*
            Resource: !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*'
          # The gateways invoke the context function by its ARN.
          - Sid: LambdaUrls
            Effect: Allow
            Action:
              - lambda:InvokeFunction
              - lambda:InvokeFunctionUrl
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
          # Bedrock's runtime calls (models, guardrails, knowledge bases, agents, flows, prompts, evaluations)
          # and AWS's AI services; cross-region inference reaches models in other regions.
          - Sid: AiCalls
            Effect: Allow
            Action:
              - aoss:APIAccessAll
              - bedrock:*
              - comprehend:*
              - kendra:Query
              - kendra:Retrieve
              - polly:SynthesizeSpeech
              - rekognition:*
              - textract:*
              - transcribe:*
              - translate:*
            Resource: '*'
          - Sid: DenyCommitments
            Effect: Deny
            Action:
              - bedrock:CreateProvisionedModelThroughput
              - bedrock:UpdateProvisionedModelThroughput
            Resource: '*'
          # Agent workflows: queues, state machines, events and alerts, by name.
          - Sid: Workflows
            Effect: Allow
            Action:
              - events:PutEvents
              - sns:Publish
              - sqs:ChangeMessageVisibility
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ReceiveMessage
              - sqs:SendMessage
              - states:Describe*
              - states:SendTask*
              - states:Start*
              - states:StopExecution
            Resource:
              - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/*'
              - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:*:${ProjectName}-*'
          # The database by IAM token; admin runs the migrations (decisions).
          - Sid: Dsql
            Effect: Allow
            Action:
              - dsql:DbConnect
              - dsql:DbConnectAdmin
            Resource: !Sub 'arn:${AWS::Partition}:dsql:${AWS::Region}:${AWS::AccountId}:cluster/*'
          - Sid: DynamoDb
            Effect: Allow
            Action:
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:ConditionCheckItem
              - dynamodb:DeleteItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource:
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-*'
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-*/index/*'
          # The demo's test buttons set a test account's password just before signing it in.
          - Sid: CognitoTestSignIn
            Effect: Allow
            Action: cognito-idp:AdminSetUserPassword
            Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
          - Sid: ParametersAndSecrets
            Effect: Allow
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*'
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore*'
              - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*'
          # Reads the policy wording; the vector store keeps its vectors.
          - Sid: Knowledge
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-knowledge-*'
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-knowledge-*/*'
          - Sid: KnowledgeVectors
            Effect: Allow
            Action:
              - s3vectors:DeleteVectors
              - s3vectors:GetIndex
              - s3vectors:GetVectors
              - s3vectors:PutVectors
              - s3vectors:QueryVectors
            Resource: !Sub 'arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ProjectName}-*/index/*'
          # Receipts, and checkpoints too large for DynamoDB.
          - Sid: AppBuckets
            Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-receipts-*'
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-receipts-*/*'
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-checkpoints-*'
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-checkpoints-*/*'
          - Sid: KmsThroughServices
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService:
                  - !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                  - !Sub 'ssm.${AWS::Region}.amazonaws.com'
                  - !Sub 's3.${AWS::Region}.amazonaws.com'
                  - !Sub 'dynamodb.${AWS::Region}.amazonaws.com'
                  - !Sub 'dsql.${AWS::Region}.amazonaws.com'

Outputs:
  BoundaryArn:
    Description: permissions_boundary for roles Terraform makes
    Value: !Ref ProjectBoundary
  StateBucketName:
    Description: GitHub variable TF_STATE_BUCKET on both environments
    Value: !Ref StateBucket
  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN on aws-dev-apply
    Value: !GetAtt DeployRole.Arn
  PlanRoleArn:
    Description: GitHub variable AWS_PLAN_ROLE_ARN on aws-dev-plan
    Value: !GetAtt PlanRole.Arn
