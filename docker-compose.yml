# The whole app on a laptop: docker compose up --build
# Ports are bound to 127.0.0.1 so nothing is reachable from the network.
name: undercover

services:
  postgres:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: ${ENVIRONMENT:?set it in .env}
      UNDERCOVER_API_KEY: ${UNDERCOVER_API_KEY:?set it in .env}
      LOCAL_SIGN_IN: ${LOCAL_SIGN_IN:-false}
      HANDLER_PASSWORD: ${HANDLER_PASSWORD:-}
      AGENT_URL: http://agent:8080
    volumes:
      # Customers' receipts, kept under random names; a private S3 bucket in stage 2.
      - receipts:/data/receipts
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"

  context:
    build: { context: ., dockerfile: apps/context/Dockerfile }
    ports:
      - "127.0.0.1:8006:8006"

  agent:
    build: { context: ., dockerfile: apps/agent/Dockerfile }
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?set it in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set it in .env}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:?set it in .env}
      UNDERCOVER_API_KEY: ${UNDERCOVER_API_KEY:?set it in .env}
      UNDERCOVER_API: http://api:8000
      UNDERCOVER_CONTEXT: http://context:8006/mcp
      CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      api: { condition: service_healthy }
      context: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:8080"

  # Customers and staff use separate web apps; each web server forwards only its own api prefix.
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        VITE_LOCAL_SIGN_IN: ${LOCAL_SIGN_IN:-false}
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:5173:8080"

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_LOCAL_SIGN_IN: ${LOCAL_SIGN_IN:-false}
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:5174:8080"

volumes:
  postgres-data:
  receipts:
