[project]
name = "travel-claims"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["undercover-api", "undercover-agent", "undercover-context"]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["apps/api", "apps/agent", "apps/context"]

[tool.uv.sources]
undercover-api = { workspace = true }
undercover-agent = { workspace = true }
undercover-context = { workspace = true }

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pyright[nodejs]==1.1.414",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "PL", "S", "PT", "FAST", "C90"]

[tool.ruff.lint.isort]
known-first-party = ["undercover_api", "undercover_agent", "undercover_context"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"apps/*/tests/*" = ["S101", "S105", "S106", "PLR0913", "PLR0917", "PLR2004"]

[tool.pyright]
include = ["apps/api", "apps/agent", "apps/context"]
exclude = ["**/node_modules", "apps/web"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/agent/tests", "apps/context/tests"]
pythonpath = ["apps/api/tests"]
addopts = "--import-mode=importlib --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["apps/api/src", "apps/agent/src", "apps/context/src"]

[tool.coverage.report]
fail_under = 80
