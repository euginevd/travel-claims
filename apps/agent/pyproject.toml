[project]
name = "undercover-agent"
version = "0.1.0"
description = "UnderCover's claim agent"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic[bedrock]==2.3.0",
    "boto3==1.43.123",
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "langgraph==1.2.19",
    "langgraph-checkpoint-postgres==3.2.0",
    "mcp==2.3.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"
