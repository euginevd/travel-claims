server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # The console loads only its own scripts and styles, and never runs inside a frame.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Engineering routes only: anything else under /api is not this app's to reach.
    location /api/engineering/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
