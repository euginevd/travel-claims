server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # The project page loads only its own files and reaches nothing else.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Re-check every file on each load: index.html pins styles.css and app.js by hash, so a cached
    # copy of one out of step with the other leaves the page unstyled.
    add_header Cache-Control "no-cache" always;

    location /api/ {
        return 404;
    }

    # The walkthrough's captions: named here, as nosniff refuses a track served under another type.
    location ~ \.vtt$ {
        types { }
        default_type "text/vtt; charset=utf-8";
    }

    location / {
        try_files $uri /index.html;
    }
}
