server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # The demo home loads only its own files, and pings the three apps on this laptop.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:5173 http://localhost:5174 http://localhost:5175; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Live numbers for the page: counts only, from a local-only route.
    location = /api/demo/stats {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
