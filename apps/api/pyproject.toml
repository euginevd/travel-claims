[project]
name = "undercover-api"
version = "0.1.0"
description = "UnderCover's claims, decisions, payments and settings"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "boto3==1.43.123",
    "fastapi==0.162.0",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.7",
    "pydantic-settings==2.16.2",
    "pyjwt[crypto]==2.15.1",
    "python-multipart==0.0.33",
    "sqlalchemy==2.1.8",
    "undercover-context",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.uv.sources]
undercover-context = { workspace = true }
