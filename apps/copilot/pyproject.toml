[project]
name = "undercover-copilot"
version = "0.1.0"
description = "UnderCover's Copilot: a chat agent for claims handlers that acts as the handler"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic[bedrock]==2.4.0",
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "langgraph==1.2.19",
    "langgraph-checkpoint-postgres==3.2.0",
    "mcp==2.3.0",
    "psycopg[binary]==3.3.7",
    "psycopg-pool==3.3.3",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"
